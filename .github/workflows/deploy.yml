name: Deploy Seemuehub Chat

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - run: git archive --format=tar.gz -o app.tar.gz HEAD

    - uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        source: app.tar.gz
        target: /tmp

    - uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        script: |
          mkdir -p ~/seemuehub-chat && cd ~/seemuehub-chat
          tar -xzf /tmp/app.tar.gz
          cat > .env << 'EOF'
          ${{ secrets.ENV }}
          EOF
          # Values that are not in ENV, each from its own repository secret or
          # variable, so adding one never means retyping the whole ENV blob.
          # Unset ones add nothing. A later line wins in docker's env_file.
          #   CHAT_INTERNAL_KEY (secret): shared with the backend's ENV; guards
          #     the backend-only routes and signs chat push requests.
          #   BACKEND_URL (variable): the backend origin, no /api/v1.
          #   ORG_CHAT_ENABLED (variable): company chat switch, kept equal to the
          #     backend's variable of the same name.
          if [ -n "${{ secrets.CHAT_INTERNAL_KEY }}" ]; then
            printf 'CHAT_INTERNAL_KEY=%s\n' '${{ secrets.CHAT_INTERNAL_KEY }}' >> .env
          fi
          if [ -n "${{ vars.BACKEND_URL }}" ]; then
            printf 'BACKEND_URL=%s\n' '${{ vars.BACKEND_URL }}' >> .env
          fi
          if [ -n "${{ vars.ORG_CHAT_ENABLED }}" ]; then
            printf 'ORG_CHAT_ENABLED=%s\n' '${{ vars.ORG_CHAT_ENABLED }}' >> .env
          fi
          echo "extra env: $(grep -cE '^(CHAT_INTERNAL_KEY|BACKEND_URL|ORG_CHAT_ENABLED)=' .env) line(s)"
          # The image now compiles from source, so the build needs room for a
          # full devDependency install. Repeated `--build` deploys leave the
          # host's build cache and superseded images behind until it runs out:
          # that is what turned a deploy into `ENOSPC: no space left on device`.
          echo "disk before:"; df -h / | tail -1
          # Cache and dangling layers only; `-a --filter until=24h` still skips
          # any image a running container is using, so this cannot stop the
          # service that is currently up.
          sudo docker builder prune -af || true
          sudo docker image prune -af --filter "until=24h" || true
          echo "disk after prune:"; df -h / | tail -1

          sudo docker compose -f docker-compose.prod.yml up -d --build

          echo "disk after build:"; df -h / | tail -1
